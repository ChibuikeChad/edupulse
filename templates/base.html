<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EduPulse{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container" style="max-width: 760px;">
      <a class="navbar-brand fw-semibold" href="/dashboard">EduPulse</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary small">{{ session["name"] }} ({{ session["role"] }})</span>
        <a href="/logout" class="btn btn-outline-secondary btn-sm">Log out</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5" style="max-width: 760px;">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="alert alert-info">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
