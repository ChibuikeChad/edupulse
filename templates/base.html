<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EduPulse{% endblock %}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        document.documentElement.setAttribute("data-bs-theme", t || "light");
      } catch (e) {}
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar border-bottom mb-4">
    <div class="container" style="max-width: 760px;">
      <a class="navbar-brand" href="/dashboard">
        <span class="brand-logo">&#9650;</span> EduPulse
      </a>
      <div class="d-flex align-items-center gap-2">
        <span class="text-secondary small d-none d-sm-inline">{{ session["name"] }} ({{ session["role"] }})</span>
        <button id="theme-btn" class="theme-btn" type="button"></button>
        <a href="/logout" class="btn btn-outline-secondary btn-sm">Log out</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5" style="max-width: 760px;">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="alert alert-info">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
