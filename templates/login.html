<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - EduPulse</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        document.documentElement.setAttribute("data-bs-theme", t || "light");
      } catch (e) {}
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="a-wrap">
  <div class="a-top">
    <a href="/" class="l-brand"><span class="brand-logo">&#9650;</span> EduPulse</a>
    <button id="theme-btn" class="theme-btn" type="button"></button>
  </div>

  <div class="a-hero">
    <h1>Welcome back</h1>
    <p>Log in to see performance and risk.</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, m in messages %}
      <div class="alert alert-{{ 'success' if cat == 'success' else 'danger' }}">{{ m }}</div>
    {% endfor %}
  {% endwith %}

  <form method="post" class="a-card">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button class="btn btn-success">Log in</button>
  </form>
  <p class="a-alt">New student? <a href="/signup">Create an account</a> &middot; <a href="/">Home</a></p>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
