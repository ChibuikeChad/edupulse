<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - EduPulse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 420px;">
    <h1 class="h3 mb-1">EduPulse</h1>
    <p class="text-secondary mb-4">Log in to see performance and risk.</p>

    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="alert alert-danger">{{ m }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="card card-body shadow-sm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-success w-100">Log in</button>
    </form>

        <p class="text-center mt-3 mb-0">New student? <a href="/signup">Create an account</a></p>

  </div>
</body>
</html>
