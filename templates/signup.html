<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up - EduPulse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 420px;">
    <h1 class="h3 mb-1">Create your account</h1>
    <p class="text-secondary mb-4">Student registration</p>

    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="alert alert-danger">{{ m }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="card card-body shadow-sm">
      <div class="mb-3"><label class="form-label">Full name</label>
        <input name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Matric number</label>
        <input name="matric_no" class="form-control" placeholder="e.g. 2022/CS/041" required></div>
      <div class="mb-3"><label class="form-label">Department</label>
        <input name="department" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-success w-100">Create account</button>
    </form>
    <p class="text-center mt-3 mb-0">Already registered? <a href="/login">Log in</a></p>
  </div>
</body>
</html>
